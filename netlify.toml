[build]
  publish = "."
  functions = "netlify/functions"

# Le site est publié depuis la racine du dépôt : on masque les fichiers qui ne sont pas destinés au public.
[[redirects]]
  from = "/gemini-key.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/nom-du-site.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true
